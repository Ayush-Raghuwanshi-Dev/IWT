<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celsius to Fahrenheit</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="title">
        <div class="card__header">
          <p class="eyebrow">Temperature Tool</p>
          <h1 id="title">Celsius to Fahrenheit</h1>
          <p class="subtitle">Convert quickly, see results instantly.</p>
        </div>

        <form class="converter" id="converter" novalidate>
          <label class="field">
            <span>Celsius</span>
            <div class="field__control">
              <input
                type="number"
                id="celsius"
                name="celsius"
                placeholder="e.g. 23"
                step="any"
                inputmode="decimal"
                required
              />
              <span class="unit">°C</span>
            </div>
          </label>

          <button class="btn" type="submit">Convert</button>
        </form>

        <div class="result" aria-live="polite">
          <p class="result__label">Fahrenheit</p>
          <p class="result__value" id="result">--</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
