<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>Create Account</h1>
        <p class="lead">Fill in your details to register.</p>
        <form class="form" id="registerForm" novalidate>
          <label class="field">
            <span>First name</span>
            <input type="text" name="firstName" required />
          </label>
          <label class="field">
            <span>Last name</span>
            <input type="text" name="lastName" required />
          </label>
          <label class="field">
            <span>Email</span>
            <input type="email" name="email" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" minlength="8" required />
            <small class="hint">Minimum 8 characters.</small>
          </label>
          <button class="btn" type="submit">Register</button>
        </form>
        <p class="message" id="registerMessage"></p>
        <p class="note">Already have an account? <a href="login.html">Login</a></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
