<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="calculator" aria-label="Calculator">
        <header class="calc-header">
          <div class="brand">shadcn-inspired</div>
          <div class="status" aria-live="polite" id="status">Ready</div>
        </header>
        <div class="display" role="presentation">
          <div class="expression" id="expression">0</div>
          <div class="result" id="result">0</div>
        </div>
        <div class="keys" role="group" aria-label="Calculator keys">
          <button class="key ghost" data-action="clear" aria-label="Clear">AC</button>
          <button class="key ghost" data-action="sign" aria-label="Toggle sign">+/-</button>
          <button class="key ghost" data-action="percent" aria-label="Percent">%</button>
          <button class="key accent" data-action="operator" data-value="/" aria-label="Divide">
            /
          </button>

          <button class="key" data-action="digit" data-value="7">7</button>
          <button class="key" data-action="digit" data-value="8">8</button>
          <button class="key" data-action="digit" data-value="9">9</button>
          <button class="key accent" data-action="operator" data-value="*" aria-label="Multiply">
            *
          </button>

          <button class="key" data-action="digit" data-value="4">4</button>
          <button class="key" data-action="digit" data-value="5">5</button>
          <button class="key" data-action="digit" data-value="6">6</button>
          <button class="key accent" data-action="operator" data-value="-" aria-label="Subtract">
            -
          </button>

          <button class="key" data-action="digit" data-value="1">1</button>
          <button class="key" data-action="digit" data-value="2">2</button>
          <button class="key" data-action="digit" data-value="3">3</button>
          <button class="key accent" data-action="operator" data-value="+" aria-label="Add">
            +
          </button>

          <button class="key wide" data-action="digit" data-value="0">0</button>
          <button class="key" data-action="decimal" data-value=".">.</button>
          <button class="key accent strong" data-action="equals" aria-label="Equals">=</button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
